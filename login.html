<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CampusEvents</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-image">
            <div class="image-content">
                <h1>CampusEvents</h1>
                <h2>Be a Part of Something Amazing!</h2>
                <p>
                    Discover events, participate in activities
                    and make unforgettable college memories.
                </p>
            </div>
        </div>

        <div class="login-form-container">

            <a href="index.html" class="back-home">← Back to Home</a>

            <div class="form-box">

                <div class="logo">CE</div>

                <h2>Welcome Back!</h2>
                <p class="subtitle">Login to your CampusEvents account</p>

                <form id="loginForm">

                    <label>Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>

                    <label>Password</label>
                    <input type="password" id="password"
                        placeholder="Enter your password" required>

                    <label>Login As</label>

                    <select id="role" required>
                        <option value="">Select your role</option>
                        <option value="admin">Admin</option>
                        <option value="organizer">Organizer</option>
                        <option value="student">Student</option>
                    </select>

                    <button type="submit">Login</button>

                </form>

                <p class="signup-link">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
