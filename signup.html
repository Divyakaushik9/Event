<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup | CampusEvents</title>

    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

    <div class="signup-container">

        <div class="signup-image">

            <div>
                <h1>CampusEvents</h1>

                <h2>Start Your College Journey!</h2>

                <p>
                    Join your college community, explore exciting
                    events and showcase your talent.
                </p>
            </div>

        </div>


        <div class="signup-form-container">

            <a href="index.html" class="back-home">← Back to Home</a>

            <div class="signup-box">

                <div class="logo">CE</div>

                <h2>Create Account</h2>

                <p class="subtitle">
                    Register as a student to get started.
                </p>

                
<form id="signupForm" action="register" method="POST">

    <div class="form-grid">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name" name="name"
                placeholder="Enter your name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" name="email"
                placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" name="password"
                placeholder="Create password"
                minlength="8" required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" name="phone"
                placeholder="Enter phone number"
                pattern="[0-9]{10}" required>
        </div>

        <div class="input-group">
            <label>College ID</label>
            <input type="text" id="collegeId" name="roll_number"
                placeholder="Enter college ID" required>
        </div>

        <div class="input-group">
            <label>Course</label>
            <input type="text" id="course" name="department"
                placeholder="Example: BCA" required>
        </div>

        <div class="input-group full-width">
            <label>Year</label>
            <select id="year" name="year" required>
                <option value="">Select Year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>
        </div>

    </div>

    <button type="submit">Create Account</button>

</form>

                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/settings.js"></script>

</body>

</html>
